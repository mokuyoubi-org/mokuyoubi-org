<!-- header.html -->
<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-primary/10"
>
  <nav
    class="max-w-5xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between gap-4"
  >
    <!-- ロゴ -->
    <a
      href="./index.html"
      class="flex items-center gap-2 text-base font-semibold tracking-wider text-text"
    >
      <span
        class="w-7 h-7 rounded-full inline-block shrink-0 bg-primary"
      ></span>
      <span class="sm:inline">MOKUYOUBI</span>
    </a>

    <div class="flex items-center gap-3 sm:gap-4">
      <!-- メインナビ -->
      <a
        href="./pricing.html"
        data-i18n="common.pricing"
        class="px-3 sm:px-4 py-2 rounded-full text-xs sm:text-sm tracking-wider text-textSub hover:text-primary hover:bg-background transition-all"
      ></a>

      <!-- 言語選択UI -->
      <div class="relative shrink-0">
        <button
          id="lang-btn"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          class="flex items-center gap-1.5 text-xs sm:text-sm text-textSub border border-primary/20 rounded-full px-3 py-1.5 bg-white hover:bg-background hover:text-primary transition-colors cursor-pointer focus:outline-none"
        >
          <span id="lang-current">日本語</span>
          <svg
            class="w-3 h-3 transition-transform"
            id="lang-arrow"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <div
          id="lang-menu"
          class="hidden absolute right-0 mt-2 w-28 bg-white border border-primary/15 rounded-2xl shadow-lg py-2 z-50 text-xs sm:text-sm"
        >
          <button
            type="button"
            data-value="zh"
            class="lang-option w-full text-left px-3 py-1.5 text-textSub hover:bg-background hover:text-primary transition-colors cursor-pointer"
          >
            中文
          </button>
          <button
            type="button"
            data-value="ko"
            class="lang-option w-full text-left px-3 py-1.5 text-textSub hover:bg-background hover:text-primary transition-colors cursor-pointer"
          >
            한국어
          </button>
          <button
            type="button"
            data-value="ja"
            class="lang-option w-full text-left px-3 py-1.5 text-textSub hover:bg-background hover:text-primary transition-colors cursor-pointer"
          >
            日本語
          </button>
          <button
            type="button"
            data-value="en"
            class="lang-option w-full text-left px-3 py-1.5 text-textSub hover:bg-background hover:text-primary transition-colors cursor-pointer"
          >
            English
          </button>
        </div>
      </div>
    </div>
  </nav>
</header>
