<!-- privacy.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKUYOUBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
  </head>
  <body
    class="font-sans text-text bg-foreground min-h-screen flex flex-col antialiased"
  >
    <div id="site-header"></div>

    <main class="flex-1 pt-16">
      <header class="bg-background py-16 border-b border-primary/10">
        <div class="max-w-3xl mx-auto px-6">
          <h1
            data-i18n="privacy.h1"
            class="font-light text-4xl sm:text-5xl md:text-6xl text-text leading-tight mb-4"
          ></h1>
          <p data-i18n="common.updated" class="text-xs text-textSub"></p>
        </div>
      </header>

      <div class="max-w-3xl mx-auto px-6 pt-12 pb-20">
        <p
          data-i18n="privacy.intro"
          class="text-base text-textSub leading-relaxed pb-10 border-b border-primary/10 mb-2"
        ></p>
        <div data-i18n="privacy.sections"></div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="./js/site.js"></script>
  </body>
</html>
