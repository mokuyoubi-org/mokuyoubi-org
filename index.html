<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKUYOUBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
  </head>
  <body
    class="font-sans text-text bg-background min-h-screen flex flex-col antialiased"
  >
    <div id="site-header"></div>
    <main class="flex-1 pt-8">
      <section class="bg-background py-12 md:py-20 px-6">
        <div class="max-w-5xl mx-auto grid md:grid-cols-2 gap-12 md:gap-8 items-center">
          <div class="text-center md:text-left">
            <div class="mb-8 flex items-center gap-4 sm:gap-8 flex-wrap justify-center md:justify-start">
              <div>
                <h1
                  data-i18n="mainTitle.hoshigoMain"
                  class="font-light text-6xl sm:text-7xl md:text-8xl text-text leading-none"
                ></h1>
                <p
                  data-i18n="mainTitle.hoshigoSub"
                  class="empty:hidden mt-4 text-xl tracking-widest text-primary"
                ></p>
              </div>
              <img
                src="./images/icon-transparent.png"
                alt="App Icon"
                class="w-20 h-20 sm:w-28 sm:h-28 bg-foreground rounded-2xl shadow-sm object-cover flex-shrink-0"
              />
            </div>
            <p
              data-i18n="home.tagline"
              class="text-base sm:text-lg text-textSub max-w-xl mx-auto md:mx-0 leading-relaxed"
            ></p>

            <!-- Buttons Section -->
            <div class="flex gap-4 flex-wrap items-center justify-center md:justify-start mt-10">
              <!-- Web version button -->
              <a
                href="https://hoshigo.app"
                class="inline-flex items-center gap-3 px-6 h-[60px] bg-text hover:opacity-90 text-background rounded-xl transition-all hover:-translate-y-0.5 shadow-sm"
              >
                <span class="text-3xl leading-none">🌐</span>
                <div class="text-left leading-none">
                  <div
                    data-i18n="webButton.sub"
                    class="text-[11px] uppercase tracking-wider opacity-80 mb-1"
                  ></div>
                  <div
                    data-i18n="webButton.main"
                    class="text-lg font-semibold tracking-wide"
                  ></div>
                </div>
              </a>
              <!-- Play Store Button -->
              <a
                href="https://play.google.com/store/apps/details?id=com.mokuyoubi.Hoshigo"
                class="inline-block transition-all hover:-translate-y-0.5"
              >
                <img
                  src="./images/playstore-button.svg"
                  alt="Get it on Google Play"
                  class="h-[60px] w-auto"
                />
              </a>
            </div>
          </div>

          <!-- Phone Image with Floor Shadow -->
          <div class="flex flex-col items-center justify-center">
            <img
              id="hero-phone"
              src="./images/smartphone-ja.png"
              alt="Hoshigo app screenshot"
              class="w-56 sm:w-64 md:w-72 h-auto transition-transform duration-300 hover:-translate-y-2 z-10"
            />
            <div class="w-40 sm:w-48 md:w-52 h-3.5 bg-black/20 rounded-[100%] blur-sm -mt-2 transition-all duration-300 hover:scale-105"></div>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="./js/site.js"></script>
  </body>
</html>
