<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKUYOUBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
  </head>
  <body
    class="font-sans text-text bg-background min-h-screen flex flex-col antialiased"
  >
    <div id="site-header"></div>

    <main class="flex-1 pt-16">
      <section class="bg-background py-24 px-6">
        <div class="max-w-5xl mx-auto">
          <div class="mb-6 flex items-center gap-6 sm:gap-8 flex-wrap">
            <div>
              <h1
                data-i18n="mainTitle.hoshigoMain"
                class="font-light text-6xl sm:text-7xl md:text-8xl text-text leading-none"
              ></h1>
              <p
                data-i18n="mainTitle.hoshigoSub"
                class="empty:hidden mt-4 text-xl tracking-widest text-primary"
              ></p>
            </div>
            <img
              src="./images/icon-transparent.png"
              alt="App Icon"
              class="w-20 h-20 sm:w-28 sm:h-28 bg-foreground rounded-2xl shadow-sm object-cover flex-shrink-0"
            />
          </div>
          <p
            data-i18n="home.tagline"
            class="text-base text-textSub max-w-xl leading-relaxed mb-10"
          ></p>
          <div class="flex gap-4 flex-wrap">
            <a
              href="https://hoshigo.app"
              class="inline-block px-8 py-4 bg-primary hover:bg-text text-foreground rounded-full text-sm transition-all hover:-translate-y-0.5 shadow-sm"
              >Web</a
            >
            <a
              href="https://play.google.com/store/apps/details?id=com.mokuyoubi.Hoshigo"
              class="inline-block px-8 py-4 bg-primary hover:bg-text text-foreground rounded-full text-sm transition-all hover:-translate-y-0.5 shadow-sm"
              >Android</a
            >
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="./js/site.js"></script>
  </body>
</html>
