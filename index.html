<!-- index.html -->

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKUYOUBI / Hoshigo</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Cormorant Garamond", "serif"],
              sans: ["Noto Sans JP", "sans-serif"],
              serif: ["Noto Serif JP", "serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-sans text-[#1a1a1a] bg-white min-h-screen flex flex-col antialiased"
  >
    <!-- ヘッダー -->
    <div id="site-header"></div>

    <!-- メインコンテンツ (Hero Section) -->
    <main class="flex-1 pt-16">
      <section class="bg-gradient-to-b from-[#f0faf2] to-white py-24 px-6">
        <div class="max-w-[1100px] mx-auto">
          <h1
            class="font-display font-light text-6xl sm:text-7xl md:text-8xl text-[#1a3a2a] mb-6 leading-none"
          >
            Hoshigo
          </h1>
          <p
            class="text-[1.05rem] text-[#4a4a4a] max-w-[560px] leading-[1.9] mb-10"
          >
            A cute, simple, beginner-friendly Go experience — for web and
            mobile.
          </p>
          <div class="flex gap-4 flex-wrap">
            <a
              href="https://hoshigo.app"
              class="inline-block px-8 py-3.5 bg-[#2d6a4f] hover:bg-[#1a3a2a] text-white rounded-full text-[0.9rem] transition-all hover:-translate-y-0.5 shadow-sm"
            >
              Web
            </a>
            <a
              href="https://play.google.com/store/apps/details?id=com.mokuyoubi.Hoshigo"
              class="inline-block px-8 py-3.5 bg-[#2d6a4f] hover:bg-[#1a3a2a] text-white rounded-full text-[0.9rem] transition-all hover:-translate-y-0.5 shadow-sm"
            >
              Android
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- フッター -->
    <div id="site-footer"></div>

    <!-- JSロジック -->
    <script type="module">
      import { renderHeaderAndFooter } from "./js/header.js";
      renderHeaderAndFooter();
    </script>
  </body>
</html>
