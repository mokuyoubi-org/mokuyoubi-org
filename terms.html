<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terms of Service - MOKUYOUBI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN & テーマ設定 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Cormorant Garamond", "serif"],
              sans: ["Noto Sans JP", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-sans text-[#1a1a1a] bg-white min-h-screen flex flex-col antialiased"
  >
    <!-- 共通ヘッダー -->
    <div id="site-header"></div>

    <main class="flex-1 pt-16">
      <article>
        <!-- Hero Header セクション（淡い緑背景エリア） -->
        <header class="bg-[#f0faf2] py-16 border-b border-[#2d6a4f]/10">
          <div class="max-w-[760px] mx-auto px-6">
            <p
              class="text-[0.78rem] tracking-[0.18em] text-[#2d6a4f] uppercase font-medium mb-3"
            >
              Terms of Service
            </p>
            <h1
              class="font-display font-light text-4xl sm:text-5xl md:text-6xl text-[#1b4332] leading-tight mb-4"
            >
              Terms of Use
            </h1>
            <p class="text-[0.82rem] text-[#888]">
              Last updated: <span id="last-updated"></span>
            </p>
          </div>
        </header>

        <!-- メインコンテンツ -->
        <div class="max-w-[760px] mx-auto px-6 pt-12 pb-20">
          <p
            class="text-base text-[#555] leading-[1.9] pb-10 border-b border-[#2d6a4f]/10 mb-2"
          >
            These Terms govern your use of services provided by the Mokuyoubi
            Team. Please read them carefully before using our services.
          </p>

          <!-- 利用規約の各セクション（JSで自動生成されるエリア） -->
          <div id="legal-sections"></div>
        </div>
      </article>
    </main>

    <!-- 共通フッター -->
    <div id="site-footer"></div>

    <script type="module">
      import { renderHeaderAndFooter } from "./js/header.js";

      // 1. ヘッダー・フッターの呼び出し
      renderHeaderAndFooter();

      // 2. データの定義（元のSvelteコードそのまま！）
      const lastUpdated = "February 2026";
      const sections = [
        {
          title: "1. Use of Service",
          body: 'The services provided under "Hoshigo" and related products (the "Service") are operated by the Mokuyoubi Team ("we" or "us"). By using the Service, you agree to these Terms. The Service is intended for users aged 13 and older.',
        },
        {
          title: "2. Accounts",
          body: "Some features require account registration. You are responsible for maintaining the accuracy of your information and the security of your account. Do not transfer or share your account with others.",
        },
        {
          title: "3. Prohibited Conduct",
          body: "You may not: use cheats or unauthorized programs; harass or defame other users; attempt unauthorized access or overload our servers; use the Service for commercial purposes without permission; or engage in any conduct we deem inappropriate.",
        },
        {
          title: "4. Intellectual Property",
          body: "All content within the Service (including logos, design, and text) is owned by the Mokuyoubi Team or respective rights holders. Personal, non-commercial use is permitted. Unauthorized reproduction or distribution is not allowed.",
        },
        {
          title: "5. Disclaimer",
          body: 'The Service is provided "as is." We do not guarantee uninterrupted availability or completeness of the Service. We are not liable for damages arising from service interruptions or data loss.',
        },
        {
          title: "6. Changes to Terms",
          body: "We may update these Terms at any time. Significant changes will be communicated within the Service. Continued use after changes constitutes acceptance of the revised Terms.",
        },
        {
          title: "7. Contact",
          body: "For questions regarding these Terms, please reach out via GitHub Issues or the support page on the respective app store.",
        },
      ];

      // 3. 画面に流し込み
      document.getElementById("last-updated").textContent = lastUpdated;

      const container = document.getElementById("legal-sections");
      container.innerHTML = sections
        .map(
          (s, index) => `
      <section class="py-8 ${index !== sections.length - 1 ? "border-b border-[#2d6a4f]/[0.07]" : ""}">
        <h2 class="text-[1.05rem] font-semibold text-[#1b4332] mb-3">${s.title}</h2>
        <p class="text-[0.92rem] text-[#555] leading-[1.9]">${s.body}</p>
      </section>
    `,
        )
        .join("");
    </script>
  </body>
</html>
