<!-- pricing.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOKUYOUBI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
  </head>
  <body
    class="font-sans text-text bg-foreground min-h-screen flex flex-col antialiased"
  >
    <div id="site-header"></div>

    <main class="flex-1 pt-16">
      <header class="bg-background py-16 border-b border-primary/10">
        <div class="max-w-3xl mx-auto px-6">
          <h1
            data-i18n="common.pricing"
            class="font-light text-4xl sm:text-5xl md:text-6xl text-text leading-tight mb-4"
          ></h1>
        </div>
      </header>

      <div class="max-w-3xl mx-auto px-6 pt-12 pb-20">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <!-- Free -->
          <section
            class="rounded-2xl border border-primary/15 bg-foreground p-6 flex flex-col transition-all duration-300 hover:shadow-lg hover:-translate-y-1"
          >
            <h2
              data-i18n="pricing.free"
              class="text-base font-semibold text-text"
            ></h2>
            <p class="mt-3 text-4xl text-text">¥0</p>
            <ul class="mt-4 space-y-2 text-sm text-textSub leading-relaxed">
              <li data-i18n="pricing.free1"></li>
            </ul>
          </section>

          <!-- Premium Monthly -->
          <section
            class="rounded-2xl border border-primary/15 bg-foreground p-6 flex flex-col transition-all duration-300 hover:shadow-lg hover:-translate-y-1"
          >
            <h2
              data-i18n="pricing.monthly"
              class="text-base font-semibold text-text"
            ></h2>
            <p class="mt-3">
              <span class="text-4xl text-text">¥240</span
              ><span
                data-i18n="pricing.perMonth"
                class="text-xs text-textSub"
              ></span>
            </p>
            <ul class="mt-4 space-y-2 text-sm text-textSub leading-relaxed">
              <li data-i18n="pricing.premium1"></li>
            </ul>
          </section>

          <!-- Premium Yearly -->
          <section
            class="rounded-2xl border border-primary/15 bg-foreground p-6 flex flex-col transition-all duration-300 hover:shadow-lg hover:-translate-y-1"
          >
            <h2
              data-i18n="pricing.yearly"
              class="text-base font-semibold text-text"
            ></h2>
            <p class="mt-3">
              <span class="text-4xl text-text">¥1,200</span
              ><span
                data-i18n="pricing.perYear"
                class="text-xs text-textSub"
              ></span>
            </p>
            <ul class="mt-4 space-y-2 text-sm text-textSub leading-relaxed">
              <li data-i18n="pricing.premium1"></li>
            </ul>
          </section>
        </div>

        <div data-i18n="pricing.notes" class="mt-12 text-sm text-textSub"></div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="./js/site.js"></script>
  </body>
</html>
