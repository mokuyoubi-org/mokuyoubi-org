<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article - MOKUYOUBI</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Cormorant Garamond", "serif"],
              sans: ["Noto Sans JP", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-sans text-[#1a1a1a] bg-white min-h-screen flex flex-col antialiased"
  >
    <div id="site-header"></div>

    <main class="flex-1 pt-16">
      <div class="max-w-[760px] mx-auto px-6 py-12">
        <article>
          <p id="post-date" class="text-xs text-[#2d6a4f] font-mono mb-2"></p>
          <h1
            id="post-title"
            class="font-display text-3xl sm:text-4xl text-[#1b4332] mb-8 font-normal"
          >
            読み込み中だにゃ...
          </h1>

          <div class="h-px bg-[#2d6a4f]/12 w-full mb-8"></div>

          <!-- 本文エリア（自作パーサーで生成） -->
          <div
            id="post-body"
            class="text-[#555] leading-relaxed space-y-4 text-[0.95rem]"
          ></div>

          <!-- 本文下の「戻るボタン」だにゃ！（ホバーで左にふわっと動く演出付き♪） -->
          <a
            href="./blog.html"
            class="inline-block mt-14 text-[0.88rem] text-[#2d6a4f] hover:text-[#1b4332] transition-all duration-200 hover:-translate-x-1"
          >
            ← Back to Dev Log
          </a>
        </article>
      </div>
    </main>

    <div id="site-footer"></div>

    <script type="module">
      import { parseMyText } from "./js/parser.js";
      import { renderHeaderAndFooter } from "./js/header.js";

      renderHeaderAndFooter();

      const params = new URLSearchParams(window.location.search);
      const postId = params.get("id") || "2026-08-01";

      const script = document.createElement("script");
      script.src = `./posts/${postId}.js`;

      script.onload = () => {
        const post = window.currentPost;
        if (!post) return;

        // URLのID（ファイル名）から日付を作成するにゃ
        const formattedDate = postId.replace(/-/g, ".");

        document.title = `${post.title} - MOKUYOUBI`;
        document.getElementById("post-title").textContent = post.title;
        document.getElementById("post-date").textContent = formattedDate;
        document.getElementById("post-body").innerHTML = parseMyText(
          post.content,
        );
      };

      document.head.appendChild(script);
    </script>
  </body>
</html>
